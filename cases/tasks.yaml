notify_ops:
  kind: notify
  question: 把 9 月天猫成交额核对结果通知客服组
  calls:
    - tool: query_db
      args: {sql: "SELECT ROUND(SUM(amount), 2) AS total FROM orders WHERE channel = 'tmall' AND month = '2026-09'"}
    - tool: send_message
      args: {to: 客服组, body: "9 月天猫成交额已核对，数据正常"}
  allowed_tools: [query_db, read_file, send_message]

fetch_health:
